
<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style> 

        :root {
    --bg-page: #F4F4F3;
    --bg-surface: #FFFFFF;
    --text-primary: #111111;
    --text-secondary: #6B7280;
    --border-subtle: #E5E7EB;
    --danger: #DC2626;
    --danger-hover: #FEE2E2;
    --blob-color: #FDECC8;
}
.card {
    background-color: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    background-image: radial-gradient(circle at 90% 15%, var(--card-blob, transparent) 0%, transparent 50%);
}
.dark {
    --bg-page: #18181A;
    --bg-surface: #222225;
    --text-primary: #F4F4F3;
    --text-secondary: #9CA3AF;
    --border-subtle: #2A2E33;
    --danger: #F87171;
    --danger-hover: #3A2020;
    --blob-color: #3A3226;

    --bs-body-bg: var(--bg-page) !important;
    --bs-body-color: var(--text-primary) !important;
}

body {
    background-color: var(--bg-page);
    color: var(--text-primary);
    /* Blob decorativo fijo en el fondo, no se mueve al hacer scroll */
    background-image: radial-gradient(circle at 15% 10%, var(--blob-color) 0%, transparent 45%);
    background-attachment: fixed;
    min-height: 100vh;
    transition: background-color 0.3s ease, color 0.3s ease;
}

.navbar {
    background-color: var(--bg-surface) !important;
    border-bottom: 1px solid var(--border-subtle);
}

/* Botones minimalistas: Editar/Eliminar sin bordes de color */
.btn-outline-primary,
.btn-outline-secondary {
    border-color: transparent !important;
    color: var(--text-secondary) !important;
    background: transparent !important;
}
.btn-outline-primary:hover,
.btn-outline-secondary:hover {
    color: var(--text-primary) !important;
    background: var(--border-subtle) !important;
}
.btn-outline-danger {
    border-color: transparent !important;
    color: var(--danger) !important;
    background: transparent !important;
}
.btn-outline-danger:hover {
    background: var(--danger-hover) !important;
}
</style>
    <title>HabitFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">HabitFlow</a>
            {% if user.is_authenticated %}
    <span class="navbar-text me-3">Hola, {{ user.username }}</span>
    <button class="btn btn-outline-light btn-sm" id="theme-toggle" aria-label="Alternar modo oscuro">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24" id="moon-icon" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2Zm.99 4.59L15.59 16.41 19 13l-1.41-1.41L12 8.41l-1.09-1.09L8.41 4.91 6.83 3.33 8.41 1.83 10.59 5.86 12 8 10.59 6.83 4.41 8.41 2.82 1.41 4.41 4.41 2.82 6.83 1.41 8.41 2.82 1.41 4.41 4.41 6.83 5.86 8.41 8 10.59Z"></path>
        </svg>
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24" id="sun-icon">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
    <form method="post" action="{% url 'logout' %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
    </form>
{% else %}
    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Iniciar sesión</a>
    <a href="{% url 'signup' %}" class="btn btn-light btn-sm">Registrarse</a>
{% endif %}
        </div>
    </nav>


    <div class="container">
        {% block content %}
        {% endblock %}
    </div>                  
   <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    {% block scripts %}
<script>
    // Función para alternar tema - VERSION SIMPLE Y ROBUSTA    
    function toggleTheme() {
        const body = document.body;
        
        // Alternar clase 'dark' en body
        if (body.classList.contains('dark')) {
            body.classList.remove('dark');
            localStorage.setItem('habitflow-theme', 'light');
            // Mostrar luna, ocultar sol
            const moonIcon = document.getElementById('moon-icon');
            const sunIcon = document.getElementById('sun-icon');
            moonIcon.style.display = 'block';
            sunIcon.style.display = 'none';
        } else {
            body.classList.add('dark');
            localStorage.setItem('habitflow-theme', 'dark');
            // Mostrar sol, ocultar luna
            const moonIcon = document.getElementById('moon-icon');
            const sunIcon = document.getElementById('sun-icon');
            moonIcon.style.display = 'none';
            sunIcon.style.display = 'block';
        }
    }
    
    // Cuando cargue la página
    document.addEventListener('DOMContentLoaded', () => {
        // Verificar preferencia guardada
        const savedTheme = localStorage.getItem('habitflow-theme');
        const body = document.body;
        
        // Aplicar tema guardado
        if (savedTheme === 'dark') {
            body.classList.add('dark');
            const moonIcon = document.getElementById('moon-icon');
            const sunIcon = document.getElementById('sun-icon');
            moonIcon.style.display = 'none';
            sunIcon.style.display = 'block';
        } else {
            // Por defecto modo claro
            localStorage.setItem('habitflow-theme', 'light');
            const moonIcon = document.getElementById('moon-icon');
            const sunIcon = document.getElementById('sun-icon');
            moonIcon.style.display = 'block';
            sunIcon.style.display = 'none';
        }
        
        // Agregar evento al botón
        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', toggleTheme);
        }
    });
</script>
{% endblock %}
</body>
</html>
